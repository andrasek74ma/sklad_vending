<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sklad">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121316">
<title>Sklad · Vending</title>
<style>
  :root{
    --bg:#121316;
    --surface:#1B1D22;
    --surface2:#24262C;
    --surface3:#2C2F37;
    --border:#33363D;
    --text:#F1F2F4;
    --text-dim:#8D919B;
    --text-faint:#5B5F68;
    --green:#2ED573;
    --green-dim:rgba(46,213,115,0.14);
    --orange:#FF8A3D;
    --orange-dim:rgba(255,138,61,0.14);
    --laser:#FF3B3B;
    --yellow:#FFC93D;
    --yellow-dim:rgba(255,201,61,0.14);
    --blue:#4DA3FF;
    --purple:#B98CFF;
    --radius:14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    overscroll-behavior:none;
  }
  .mono{ font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:0.02em; }
  #app{ display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

  /* HEADER */
  header{
    padding: calc(14px + var(--safe-top)) 18px 14px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 6px),
      linear-gradient(180deg, var(--surface2), var(--surface));
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  header h1{ margin:0; font-size:20px; font-weight:800; letter-spacing:-0.02em; }
  header .sub{ margin-top:3px; font-size:12.5px; color:var(--text-dim); font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px calc(90px + var(--safe-bottom)); }

  /* TABBAR */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(27,29,34,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding: 8px 4px calc(8px + var(--safe-bottom));
    z-index:40;
  }
  nav.tabbar button{
    background:none; border:none; color:var(--text-faint); display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; font-weight:600; padding:4px 10px; border-radius:10px; flex:1;
  }
  nav.tabbar button svg{ width:22px; height:22px; }
  nav.tabbar button.active{ color:var(--text); }
  nav.tabbar button.active.c-prijem{ color:var(--green); }
  nav.tabbar button.active.c-vydaj{ color:var(--orange); }

  /* CARDS */
  .card{ background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stack{ display:flex; flex-direction:column; gap:10px; }

  .btn{
    appearance:none; border:none; border-radius:12px; padding:14px 16px; font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; color:var(--bg);
    background:var(--text);
  }
  .btn:active{ transform:scale(0.98); }
  .btn.ghost{ background:var(--surface3); color:var(--text); border:1px solid var(--border); }
  .btn.green{ background:var(--green); color:#08210F; }
  .btn.orange{ background:var(--orange); color:#2B1200; }
  .btn.danger{ background:var(--laser); color:#fff; }
  .btn.sm{ padding:9px 12px; font-size:13px; width:auto; }
  .btn:disabled{ opacity:0.4; }

  input, select{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:12px 12px; border-radius:10px; font-size:15px; outline:none;
  }
  input:focus, select:focus{ border-color:var(--text-dim); }
  label.field{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--text-dim); font-weight:600; margin-bottom:12px; }

  .badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; display:inline-block; }
  .badge.napoje{ background:rgba(77,163,255,0.14); color:var(--blue); }
  .badge.snacky{ background:var(--yellow-dim); color:var(--yellow); }
  .badge.energy{ background:rgba(185,140,255,0.14); color:var(--purple); }
  .badge.ine{ background:var(--surface3); color:var(--text-dim); }

  .qty{ font-size:22px; font-weight:800; }
  .qty.low{ color:var(--yellow); }
  .qty.zero{ color:var(--laser); }

  .searchbar{ display:flex; gap:8px; margin-bottom:12px; }
  .searchbar input{ flex:1; }

  .chips{ display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px; }
  .chip{ flex-shrink:0; padding:7px 13px; border-radius:20px; background:var(--surface2); border:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--text-dim); }
  .chip.active{ background:var(--text); color:var(--bg); border-color:var(--text); }

  .empty{ text-align:center; padding:50px 20px; color:var(--text-faint); }
  .empty svg{ width:44px; height:44px; margin-bottom:12px; opacity:0.6; }
  .empty .t{ font-weight:700; color:var(--text-dim); margin-bottom:4px; }
  .empty .d{ font-size:13px; }

  .hero-scan{
    border-radius:var(--radius); padding:20px 16px; margin-bottom:14px; position:relative; overflow:hidden;
    border:1px solid var(--border);
  }
  .hero-scan.pr{ background:linear-gradient(135deg, var(--green-dim), var(--surface2)); }
  .hero-scan.vd{ background:linear-gradient(135deg, var(--orange-dim), var(--surface2)); }
  .hero-scan h2{ margin:0 0 4px; font-size:17px; }
  .hero-scan p{ margin:0 0 14px; font-size:13px; color:var(--text-dim); }

  .divider-or{ display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--text-faint); font-size:11px; font-weight:700; }
  .divider-or::before, .divider-or::after{ content:''; flex:1; height:1px; background:var(--border); }

  .txn{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
  .txn:last-child{ border-bottom:none; }
  .txn .icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .txn .icon.pr{ background:var(--green-dim); color:var(--green); }
  .txn .icon.vd{ background:var(--orange-dim); color:var(--orange); }
  .txn .icon svg{ width:17px; height:17px; }
  .txn .info{ flex:1; min-width:0; }
  .txn .info .name{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .txn .info .meta{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
  .txn .delta{ font-weight:800; font-size:15px; flex-shrink:0; }
  .txn .delta.pr{ color:var(--green); }
  .txn .delta.vd{ color:var(--orange); }

  /* OVERLAY / MODAL */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100;
    display:flex; align-items:flex-end;
    opacity:0; pointer-events:none; transition:opacity 0.18s;
  }
  .overlay.open{ opacity:1; pointer-events:all; }
  .sheet{
    background:var(--surface); width:100%; border-radius:20px 20px 0 0; padding:18px 18px calc(18px + var(--safe-bottom));
    max-height:88dvh; overflow-y:auto; transform:translateY(16px); transition:transform 0.18s;
    border-top:1px solid var(--border);
  }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px; }
  .sheet h3{ margin:0 0 4px; font-size:17px; }
  .sheet .sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:16px; }
  .sheet-close{ position:absolute; top:14px; right:14px; color:var(--text-faint); background:var(--surface3); border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:none; }

  /* SCANNER */
  #scannerOverlay{ position:fixed; inset:0; background:#000; z-index:200; display:none; flex-direction:column; }
  #scannerOverlay.open{ display:flex; }
  #reader{ flex:1; position:relative; overflow:hidden; }
  #reader video{ object-fit:cover !important; width:100% !important; height:100% !important; }
  .scan-topbar{ position:absolute; top:calc(14px + var(--safe-top)); left:14px; right:14px; z-index:10; display:flex; justify-content:space-between; align-items:center; }
  .scan-topbar .label{ color:#fff; font-weight:700; font-size:14px; text-shadow:0 1px 4px rgba(0,0,0,0.6); }
  .scan-close{ background:rgba(0,0,0,0.5); color:#fff; border:none; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .viewfinder{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:78%; max-width:340px; height:130px; z-index:5; pointer-events:none; }
  .viewfinder .corner{ position:absolute; width:26px; height:26px; border-color:var(--laser); }
  .viewfinder .tl{ top:0; left:0; border-top:3px solid; border-left:3px solid; border-radius:6px 0 0 0; }
  .viewfinder .tr{ top:0; right:0; border-top:3px solid; border-right:3px solid; border-radius:0 6px 0 0; }
  .viewfinder .bl{ bottom:0; left:0; border-bottom:3px solid; border-left:3px solid; border-radius:0 0 0 6px; }
  .viewfinder .br{ bottom:0; right:0; border-bottom:3px solid; border-right:3px solid; border-radius:0 0 6px 0; }
  .viewfinder .laser{ position:absolute; left:4%; right:4%; height:2px; background:var(--laser); box-shadow:0 0 8px 1px var(--laser); animation:scanmove 1.6s ease-in-out infinite; }
  @keyframes scanmove{ 0%{ top:6%; } 50%{ top:92%; } 100%{ top:6%; } }
  .scan-hint{ position:absolute; bottom:calc(30px + var(--safe-bottom)); left:0; right:0; text-align:center; color:#fff; font-size:13px; text-shadow:0 1px 4px rgba(0,0,0,0.6); z-index:10; }
  .scan-manual{ padding:16px; padding-bottom:calc(16px + var(--safe-bottom)); background:#0A0A0C; display:flex; gap:8px; flex-shrink:0; }

  /* TOAST */
  #toast{ position:fixed; left:16px; right:16px; bottom:calc(96px + var(--safe-bottom)); z-index:300; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .toast-msg{ background:var(--surface3); border:1px solid var(--border); color:var(--text); padding:12px 14px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,0.35); opacity:0; transform:translateY(6px); transition:all 0.25s; }
  .toast-msg.err{ border-color:rgba(255,59,59,0.4); color:#ffb4b4; }
  .toast-msg.ok{ border-color:rgba(46,213,115,0.35); color:#b7f5cd; }
  .toast-msg.show{ opacity:1; transform:translateY(0); }

  /* LOCK SCREEN */
  #lockScreen{ position:fixed; inset:0; background:var(--bg); z-index:500; display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
  #lockScreen.open{ display:flex; }
  #lockScreen .lockIcon{ width:74px; height:74px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin-bottom:20px; }
  #lockScreen .lockIcon svg{ width:36px; height:36px; color:var(--text-dim); }
  #lockScreen h2{ margin:0 0 6px; font-size:19px; }
  #lockScreen p{ margin:0 0 24px; font-size:13.5px; color:var(--text-dim); max-width:280px; }
  #lockScreen .btn{ max-width:260px; }
  .pin-dots{ display:flex; gap:14px; margin-bottom:22px; }
  .pin-dots .d{ width:14px; height:14px; border-radius:50%; border:2px solid var(--text-faint); }
  .pin-dots .d.filled{ background:var(--text); border-color:var(--text); }
  .pin-keypad{ display:grid; grid-template-columns:repeat(3,64px); gap:14px; margin-bottom:16px; }
  .pin-keypad button{ width:64px; height:64px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:22px; font-weight:600; }
  .pin-keypad button:active{ background:var(--surface3); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row" style="align-items:flex-start;">
      <div>
        <h1 id="headerTitle">Sklad</h1>
        <div class="sub" id="headerSub">— · —</div>
      </div>
      <button id="lockSettingsBtn" style="background:var(--surface3); border:1px solid var(--border); color:var(--text-dim); width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      </button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-tab="sklad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8L12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
      Sklad
    </button>
    <button data-tab="prijem" class="c-prijem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
      Príjem
    </button>
    <button data-tab="vydaj" class="c-vydaj">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M17 14l-5-5-5 5"/><path d="M4 4h16"/></svg>
      Výdaj
    </button>
    <button data-tab="historia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      História
    </button>
  </nav>
</div>

<div id="modalOverlay" class="overlay"><div class="sheet" id="modalSheet" style="position:relative;"></div></div>

<div id="scannerOverlay">
  <div id="reader"></div>
  <div class="scan-topbar">
    <div class="label" id="scanLabel">Skenovanie čiarového kódu</div>
    <button class="scan-close" id="scanCloseBtn">✕</button>
  </div>
  <div class="viewfinder">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="laser"></div>
  </div>
  <div class="scan-hint">Podržte kód pevne v ráme, kým sa kód potvrdí</div>
  <div class="scan-manual">
    <input id="manualBarcodeInput" placeholder="alebo zadajte kód ručne" inputmode="numeric" class="mono">
    <button class="btn sm ghost" id="manualBarcodeBtn" style="width:auto;">OK</button>
  </div>
</div>

<div id="toast"></div>

<div id="lockScreen">
  <div class="lockIcon" id="lockIconWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5a3 3 0 016 0v3"/><rect x="4" y="10" width="16" height="4" rx="1"/><path d="M6 14v4a2 2 0 002 2h8a2 2 0 002-2v-4"/><circle cx="12" cy="17" r="1.4"/></svg>
  </div>
  <h2 id="lockTitle">Sklad je uzamknutý</h2>
  <p id="lockDesc">Overte identitu, aby ste videli skladové dáta.</p>
  <div id="lockActionArea"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- STATE ---------- */
  let products = [];       // {id, barcode, nazov, kategoria, mnozstvo, min, updatedAt}
  let transactions = [];   // {id, typ:'prijem'|'vydaj', barcode, nazov, mnozstvo, automat, userEmail, ts}
  let automaty = [];       // ["Bufet ZŠ", ...]
  let tab = 'sklad';
  let skladFilter = { q:'', kat:'vsetko' };
  let historyFilter = 'vsetko';
  let html5QrCode = null;
  let scanTargetCallback = null;
  let currentUser = null;  // { email }
  let realtimeChannel = null;

  const CATS = [
    {id:'napoje', label:'Nápoje', cls:'napoje'},
    {id:'snacky', label:'Snacky', cls:'snacky'},
    {id:'energy', label:'Energy drinky', cls:'energy'},
    {id:'ine', label:'Iné', cls:'ine'}
  ];
  const LOW_STOCK_DEFAULT = 5;

  const $ = (sel, root) => (root||document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = (ts) => {
    const d = new Date(ts);
    return d.toLocaleDateString('sk-SK', {day:'2-digit', month:'2-digit'}) + ' · ' + d.toLocaleTimeString('sk-SK', {hour:'2-digit', minute:'2-digit'});
  };
  const catInfo = (id) => CATS.find(c => c.id === id) || CATS[3];

  function toast(msg, isErr){
    const el = document.createElement('div');
    el.className = 'toast-msg ' + (isErr ? 'err' : 'ok');
    el.textContent = msg;
    $('#toast').appendChild(el);
    requestAnimationFrame(()=> el.classList.add('show'));
    setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=> el.remove(), 300);
    }, 2600);
  }

  /* ---------- SUPABASE PRIPOJENIE ---------- */
  // Vyplň tieto dve hodnoty podľa svojho Supabase projektu: Settings → API
  const SUPABASE_URL = 'https://mzrgihorpbrwzbppiaxv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_w2avPm53OZk6KSHPoUIrsw_4DF0bl81';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ---------- PRIHLÁSENIE ---------- */
  async function checkSession(){
    const { data } = await sb.auth.getSession();
    if (data.session){
      currentUser = { email: data.session.user.email };
      return true;
    }
    return false;
  }
  async function login(email, password){
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error){ toast('Prihlásenie zlyhalo: ' + error.message, true); return false; }
      currentUser = { email: data.user.email };
      return true;
    }catch(e){
      toast('Chyba pripojenia na server: ' + (e && e.message ? e.message : e), true);
      return false;
    }
  }
  async function logout(){
    await sb.auth.signOut();
    currentUser = null;
    if (realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    showLoginScreen();
  }

  function showLoginScreen(){
    $('#lockScreen').classList.add('open');
    $('#lockIconWrap').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 8l8 6 8-6"/></svg>';
    $('#lockTitle').textContent = 'Prihlásenie do skladu';
    $('#lockDesc').textContent = 'Prihlás sa firemným účtom.';
    $('#lockActionArea').innerHTML =
      '<label class="field" style="text-align:left; width:100%; max-width:280px;">E-mail<input id="loginEmail" type="email" autocomplete="username" placeholder="meno@firma.sk"></label>'
      + '<label class="field" style="text-align:left; width:100%; max-width:280px;">Heslo<input id="loginPassword" type="password" autocomplete="current-password"></label>'
      + '<button class="btn" id="btnLogin" style="max-width:280px;">Prihlásiť sa</button>';
    $('#btnLogin').addEventListener('click', async () => {
      const email = $('#loginEmail').value.trim();
      const pass = $('#loginPassword').value;
      if (!email || !pass) return toast('Zadaj email aj heslo', true);
      $('#btnLogin').disabled = true; $('#btnLogin').textContent = 'Prihlasujem…';
      try{
        const ok = await login(email, pass);
        if (ok){ hideLoginScreen(); await startApp(); }
      }catch(e){
        toast('Neočakávaná chyba: ' + (e && e.message ? e.message : e), true);
      }finally{
        $('#btnLogin').disabled = false; $('#btnLogin').textContent = 'Prihlásiť sa';
      }
    });
  }
  function hideLoginScreen(){ $('#lockScreen').classList.remove('open'); }

  function openAccountSettings(){
    openModal(
      '<h3>Účet</h3><div class="sub">Prihlásený ako '+esc(currentUser ? currentUser.email : '')+'</div>'
      + '<button class="btn ghost" id="btnLogout" style="color:var(--laser);">Odhlásiť sa</button>'
    );
    $('#btnLogout').addEventListener('click', () => { closeModal(); logout(); });
  }

  /* ---------- STORAGE (Supabase - spoločná databáza pre celý tím) ---------- */
  async function loadAll(){
    try{
      const { data, error } = await sb.from('products').select('*').order('nazov');
      if (error) throw error;
      products = (data||[]).map(rowToProduct);
    }catch(e){ products = []; toast('Nepodarilo sa načítať sklad', true); }
    try{
      const { data, error } = await sb.from('transactions').select('*').order('created_at', {ascending:false}).limit(500);
      if (error) throw error;
      transactions = (data||[]).map(rowToTxn);
    }catch(e){ transactions = []; }
    try{
      const { data, error } = await sb.from('automaty').select('nazov');
      if (error) throw error;
      automaty = (data||[]).map(r => r.nazov);
    }catch(e){ automaty = []; }
  }
  function rowToProduct(r){ return { id:r.id, barcode:r.barcode, nazov:r.nazov, kategoria:r.kategoria, mnozstvo:r.mnozstvo, min:r.min_mnozstvo, updatedAt:new Date(r.updated_at).getTime() }; }
  function rowToTxn(r){ return { id:r.id, typ:r.typ, barcode:r.barcode, nazov:r.nazov, mnozstvo:r.mnozstvo, automat:r.automat, userEmail:r.user_email, ts:new Date(r.created_at).getTime() }; }

  async function dbInsertProduct(p){
    const { data, error } = await sb.from('products').insert({
      barcode:p.barcode, nazov:p.nazov, kategoria:p.kategoria, mnozstvo:p.mnozstvo, min_mnozstvo:p.min
    }).select().single();
    if (error){ toast('Uloženie produktu zlyhalo', true); return null; }
    return rowToProduct(data);
  }
  async function dbUpdateProduct(p){
    const { error } = await sb.from('products').update({
      nazov:p.nazov, kategoria:p.kategoria, mnozstvo:p.mnozstvo, min_mnozstvo:p.min, updated_at:new Date().toISOString()
    }).eq('id', p.id);
    if (error) toast('Uloženie zlyhalo', true);

  async function dbDeleteProduct(id){

  async function dbInsertTransaction(typ, product, mnozstvo, automat){

  /* ---------- REALTIME - synchronizácia medzi zariadeniami tímu ---------- */
  function subscribeRealtime(){
    if (realtimeChannel) sb.removeChannel(realtimeChannel);
    realtimeChannel = sb.channel('sklad-changes')
      .on('postgres_changes', { event:'*', schema:'public', table:'products' }, async () => {
        await loadAll(); render();
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'transactions' }, async () => {
        await loadAll(); if (tab === 'historia') render();
      })
      .subscribe();
  }

  function setActiveTab(newTab){
    tab = newTab;
    $$('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    const titles = { sklad:'Sklad', prijem:'Príjem na sklad', vydaj:'Výdaj zo skladu', historia:'História pohybov' };
    $('#headerTitle').textContent = titles[tab];
    const totalKusov = products.reduce((s,p)=>s+p.mnozstvo,0);
    const subMap = {
      sklad: products.length + ' produktov · ' + totalKusov + ' ks celkom',
      prijem: 'Naskenujte alebo zadajte kód produktu',

      historia: transactions.length + ' záznamov'
    };
    $('#headerSub').textContent = subMap[tab];

  function render(){
    const main = $('#main');
    if (tab === 'sklad') main.innerHTML = renderSklad();
    else if (tab === 'prijem') main.innerHTML = renderPrijem();
    else if (tab === 'vydaj') main.innerHTML = renderVydaj();
    else main.innerHTML = renderHistoria();
    bindScreenEvents();
  }

  /* ---------- SKLAD ---------- */
  function renderSklad(){
    let list = products.filter(p => {
      const matchQ = !skladFilter.q || p.nazov.toLowerCase().includes(skladFilter.q.toLowerCase()) || p.barcode.includes(skladFilter.q);
      const matchK = skladFilter.kat === 'vsetko' || p.kategoria === skladFilter.kat;
      return matchQ && matchK;
    }).sort((a,b) => a.nazov.localeCompare(b.nazov, 'sk'));

    const chips = ['<button class="chip '+(skladFilter.kat==='vsetko'?'active':'')+'" data-kat="vsetko">Všetko</button>']
      .concat(CATS.map(c => '<button class="chip '+(skladFilter.kat===c.id?'active':'')+'" data-kat="'+c.id+'">'+c.label+'</button>')).join('');

    let body;
    if (!products.length){
      body = emptyState('sklad', 'Sklad je zatiaľ prázdny', 'Naskenujte prvý produkt v sekcii Príjem.');
    } else if (!list.length){
      body = emptyState('search', 'Nič nenájdené', 'Skúste iné hľadanie alebo kategóriu.');
    } else {
      body = list.map(p => {
        const isZero = p.mnozstvo <= 0;
        const isLow = !isZero && p.mnozstvo <= (p.min || LOW_STOCK_DEFAULT);
        const ci = catInfo(p.kategoria);
        return '<div class="card" data-open-product="'+p.id+'" style="'+(isLow?'border-left:3px solid var(--yellow);':(isZero?'border-left:3px solid var(--laser);':''))+'">'
          + '<div class="row">'
          + '<div style="min-width:0;">'
          + '<div style="font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(p.nazov)+'</div>'
          + '<div style="margin-top:4px; display:flex; align-items:center; gap:8px;">'
          + '<span class="badge '+ci.cls+'">'+ci.label+'</span>'
          + '<span class="mono" style="font-size:11px; color:var(--text-faint);">'+esc(p.barcode)+'</span>'
          + '</div></div>'
          + '<div style="text-align:right; flex-shrink:0;"><div class="qty '+(isZero?'zero':(isLow?'low':''))+'">'+p.mnozstvo+'</div><div style="font-size:10.5px; color:var(--text-faint);">ks</div></div>'
          + '</div></div>';

      + '<input id="skladSearch" placeholder="Hľadať podľa názvu alebo kódu" value="'+esc(skladFilter.q)+'">'

  /* ---------- EVENTS PER SCREEN ---------- */
  function bindScreenEvents(){
    if (tab === 'sklad'){
      const search = $('#skladSearch');
      if (search) search.addEventListener('input', e => { skladFilter.q = e.target.value; render(); });
      $$('.chip[data-kat]').forEach(b => b.addEventListener('click', () => { skladFilter.kat = b.dataset.kat; render(); }));
      $$('[data-open-product]').forEach(c => c.addEventListener('click', () => openProductDetail(c.dataset.openProduct)));
    }
    if (tab === 'prijem'){
      $('#btnScanPrijem').addEventListener('click', () => openScanner('prijem', 'Skenovanie — Príjem'));
      $('#btnPrijemManual').addEventListener('click', () => {
        const v = $('#prijemManualCode').value.trim();
        if (!v) return toast('Zadajte kód produktu', true);
        handleScannedCode('prijem', v);
      });
    }
    if (tab === 'vydaj'){
      $('#btnScanVydaj').addEventListener('click', () => openScanner('vydaj', 'Skenovanie — Výdaj'));
      $('#btnVydajManual').addEventListener('click', () => {
        const v = $('#vydajManualCode').value.trim();
        if (!v) return toast('Zadajte kód produktu', true);
        handleScannedCode('vydaj', v);
      });
    }
    if (tab === 'historia'){
      $$('.chip[data-hist]').forEach(b => b.addEventListener('click', () => { historyFilter = b.dataset.hist; render(); }));
    }
  }

  /* ---------- SCANNER ---------- */
  let lastScanCode = null;
  let lastScanCount = 0;

  function openScanner(mode, label){
    $('#scanLabel').textContent = label;
    $('#scannerOverlay').classList.add('open');
    $('#manualBarcodeInput').value = '';
    scanTargetCallback = mode;
    lastScanCode = null;
    lastScanCount = 0;

    // Len skutočné formáty čiarových kódov z obalov (EAN/UPC) - obmedzenie znižuje počet chybných čítaní
    const formats = [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E
    ];
    try{
      html5QrCode = new Html5Qrcode("reader", { formatsToSupport: formats, verbose:false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
      html5QrCode.start(
        { facingMode: { ideal: "environment" } },
        {
          fps: 8,
          qrbox: { width: 280, height: 140 },
          videoConstraints: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: "continuous" }] }
        },
        (decodedText) => {
          const code = decodedText.trim();
          // Potvrdenie: rovnaký kód musí byť prečítaný 2x po sebe, inak zahodíme jednorazovú chybu
          if (code === lastScanCode){
            lastScanCount++;
          } else {
            lastScanCode = code;
            lastScanCount = 1;
          }
          if (lastScanCount >= 2){
            const mode = scanTargetCallback;
            closeScanner();
            handleScannedCode(mode, code);
          }
        },
        () => {}
      ).catch(err => {
        const insecure = location.protocol !== 'https:' && location.hostname !== 'localhost';
        toast(insecure ? 'Kamera funguje len cez HTTPS — appku treba hostovať online (pozri návod nižšie)' : 'Kamera nedostupná: skontrolujte povolenia', true);
        closeScanner();
      });
    }catch(e){
      toast('Skener sa nepodarilo spustiť', true);
      closeScanner();
    }
  }
  function closeScanner(){
    $('#scannerOverlay').classList.remove('open');
    if (html5QrCode){
      html5QrCode.stop().then(()=> html5QrCode.clear()).catch(()=>{});
      html5QrCode = null;
    }
  }
  $('#scanCloseBtn').addEventListener('click', closeScanner);
  $('#manualBarcodeBtn').addEventListener('click', () => {
    const v = $('#manualBarcodeInput').value.trim();
    if (!v) return;
    const mode = scanTargetCallback;
    closeScanner();
    handleScannedCode(mode, v);
  });

  /* ---------- CORE FLOWS ---------- */
  function handleScannedCode(mode, code){
    const product = products.find(p => p.barcode === code);
    if (mode === 'prijem'){
      if (product) openPrijemConfirm(product);
      else openNewProductForm(code);
    } else {
      if (product) openVydajConfirm(product);
      else openNotFoundForVydaj(code);
    }
  }

  function openModal(html){
    $('#modalSheet').innerHTML = '<button class="sheet-close" id="modalCloseBtn">✕</button><div class="sheet-handle"></div>' + html;
    $('#modalOverlay').classList.add('open');
    $('#modalCloseBtn').addEventListener('click', closeModal);
  }
  function closeModal(){ $('#modalOverlay').classList.remove('open'); }
  $('#modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });

  function openNewProductForm(barcode){
    openModal(
      '<h3>Nový produkt</h3><div class="sub">Kód '+esc(barcode)+' zatiaľ nie je na sklade. Založte ho.</div>'
      + '<label class="field">Kód produktu<input id="npBarcode" class="mono" value="'+esc(barcode)+'" readonly style="opacity:0.6;"></label>'
      + '<label class="field">Názov produktu<input id="npNazov" placeholder="napr. Coca-Cola 0,33l" autofocus></label>'
      + '<label class="field">Kategória<select id="npKat">'+CATS.map(c=>'<option value="'+c.id+'">'+c.label+'</option>').join('')+'</select></label>'
      + '<label class="field">Počiatočné množstvo (ks)<input id="npMnozstvo" type="number" inputmode="numeric" value="1" min="0"></label>'

      const nazov = $('#npNazov').value.trim();
      const kat = $('#npKat').value;
      const mn = parseInt($('#npMnozstvo').value, 10);

      $('#npSubmit').disabled = true;
      const p = await dbInsertProduct({ barcode, nazov, kategoria: kat, mnozstvo: mn, min: LOW_STOCK_DEFAULT });
      if (!p) { $('#npSubmit').disabled = false; return; }
      await dbInsertTransaction('prijem', p, mn, null);

    });

      + '<div style="font-weight:700;">'+esc(product.nazov)+'</div>'
      + '<div style="margin-top:5px;"><span class="badge '+ci.cls+'">'+ci.label+'</span> <span class="mono" style="font-size:11px; color:var(--text-faint);">'+esc(product.barcode)+'</span></div>'
      + '</div></div></div>'
      + '<label class="field">Prijaté množstvo (ks)<input id="prMnozstvo" type="number" inputmode="numeric" value="1" min="1" autofocus></label>'
      + '<button class="btn green" id="prSubmit">Pridať na sklad</button>'

      + '<div style="font-weight:700;">'+esc(product.nazov)+'</div>'
      + '<div style="margin-top:5px;"><span class="badge '+ci.cls+'">'+ci.label+'</span> <span class="mono" style="font-size:11px; color:var(--text-faint);">'+esc(product.barcode)+'</span></div>'
      + '</div></div></div>'
      + '<label class="field">Vydávané množstvo (ks)<input id="vdMnozstvo" type="number" inputmode="numeric" value="1" min="1" max="'+product.mnozstvo+'"></label>'
      + '<label class="field">Vending automat / miesto<input id="vdAutomat" list="automatList" placeholder="napr. Automat — vrátnica"></label>'
      + datalist

      + '<label class="field">Hranica nízkeho stavu<input id="pdMin" type="number" inputmode="numeric" value="'+(p.min||LOW_STOCK_DEFAULT)+'" min="0"></label>'
      + '<div style="display:flex; gap:8px; margin-top:6px;">'
      + '<button class="btn ghost" id="pdDelete" style="color:var(--laser);">Vymazať</button>'
      + '<button class="btn ghost" id="pdSave">Uložiť zmeny</button>'
      + '</div>'
    );
    $('#pdPrijem').addEventListener('click', () => openPrijemConfirm(p));
    $('#pdVydaj').addEventListener('click', () => openVydajConfirm(p));
    $('#pdSave').addEventListener('click', async () => {
      const nazov = $('#pdNazov').value.trim();
      const kat = $('#pdKat').value;
      const mn = parseInt($('#pdMnozstvo').value, 10);
      const min = parseInt($('#pdMin').value, 10);
      if (!nazov) return toast('Zadajte názov', true);
      if (isNaN(mn) || mn < 0) return toast('Neplatné množstvo', true);
      $('#pdSave').disabled = true;
      p.nazov = nazov; p.kategoria = kat; p.mnozstvo = mn; p.min = isNaN(min)?LOW_STOCK_DEFAULT:min;
      await dbUpdateProduct(p);
      await loadAll();
      closeModal();
      toast('Produkt aktualizovaný');
      setActiveTab('sklad');
    });
    $('#pdDelete').addEventListener('click', async () => {
      if (!confirm('Naozaj vymazať produkt "'+p.nazov+'" zo skladu?')) return;
      await dbDeleteProduct(id);
      await loadAll();
      closeModal();
      toast('Produkt vymazaný');
      setActiveTab('sklad');
    });
  }

  /* ---------- INIT ---------- */
  $$('.tabbar button').forEach(b => b.addEventListener('click', () => setActiveTab(b.dataset.tab)));
  $('#lockSettingsBtn').addEventListener('click', () => openAccountSettings());

  async function startApp(){
    await loadAll();
    setActiveTab('sklad');
    subscribeRealtime();
  }

  (async function init(){
    const loggedIn = await checkSession();
    if (loggedIn){ await startApp(); }
    else { showLoginScreen(); }
  })();
})();
</script>
</body>
</html>
